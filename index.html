<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>VIPGram Ultimate - @VIPboris</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        :root { --bg: #0e1621; --side: #17212b; --acc: #2481cc; --txt: #ffffff; --admin: #f4b400; }
        body { margin: 0; background: var(--bg); color: var(--txt); font-family: sans-serif; display: flex; height: 100vh; overflow: hidden; }
        
        #boss-sidebar { position: fixed; left: -300px; top: 0; width: 280px; height: 100%; background: var(--side); transition: 0.3s; z-index: 10000; border-right: 2px solid var(--admin); padding: 20px; box-sizing: border-box; }
        #boss-sidebar.active { left: 0; }

        .sidebar { width: 320px; background: var(--side); border-right: 1px solid #000; display: flex; flex-direction: column; }
        .stories { display: flex; padding: 10px; gap: 10px; overflow-x: auto; background: #101921; border-bottom: 1px solid #000; }
        .st-item { min-width: 55px; height: 55px; border-radius: 50%; border: 2px solid var(--acc); cursor: pointer; background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; font-size: 8px; color: var(--txt); text-align: center; overflow: hidden; background-color: #333; }
        
        .search-area { padding: 10px; background: #101921; }
        .chat-list { flex: 1; overflow-y: auto; }
        .chat-item { padding: 15px; border-bottom: 1px solid #101921; cursor: pointer; }
        .chat-item:hover { background: #2b5278; }

        .main { flex: 1; display: flex; flex-direction: column; }
        .header { padding: 10px 15px; background: var(--side); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #000; }
        .msgs { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; }
        .msg { padding: 10px; border-radius: 10px; margin: 5px; max-width: 75%; }
        
        .blue { background: #2b5278; } .orange { background: #d47e2e; } .green { background: #458a4d; } .pink { background: #b03e7a; } .purple { background: #6a3eb0; }
        .recv { align-self: flex-start; background: #182533; }
        .sent { align-self: flex-end; }
        
        input, select { width: 100%; padding: 10px; margin: 5px 0; border-radius: 5px; border: 1px solid #242f3d; background: #0e1621; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: var(--acc); color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-bottom: 5px; }
        .adm-btn { background: var(--admin); color: black; }
        
        #auth-screen { position: fixed; inset: 0; background: var(--bg); z-index: 9000; display: flex; justify-content: center; align-items: center; }
        #story-viewer { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 11000; justify-content: center; align-items: center; cursor: pointer; }
    </style>
</head>
<body>

<div id="boss-sidebar">
    <h2 style="color:var(--admin)">BOSS PANEL</h2>
    <input type="text" id="target-id" placeholder="Номер юзера">
    <button class="adm-btn" onclick="bossCmd('isPremium', true)">Дать Premium 🌟</button>
    <button class="adm-btn" onclick="bossCmd('isPremium', false)" style="background:red">Забрать Premium</button>
    <button class="adm-btn" onclick="bossCmd('nft', true)" style="background:green">Дать NFT 🖼️</button>
    <button onclick="createChatPrompt()">Создать Группу/Канал</button>
    <hr style="border:1px solid #242f3d">
    <button onclick="document.getElementById('boss-sidebar').classList.remove('active')">Закрыть</button>
</div>

<div id="auth-screen">
    <div style="background:var(--side); padding:30px; border-radius:15px; width:300px; text-align:center;">
        <h2>VIPGram</h2>
        <input type="text" id="a-phone" placeholder="Ваш номер">
        <input type="password" id="a-pass" placeholder="Пароль">
        <button onclick="auth()">Войти</button>
    </div>
</div>

<div class="sidebar">
    <div class="stories" id="st-box">
        <div class="st-item" onclick="postStory()">+ История</div>
    </div>
    <div class="header">
        <div onclick="document.getElementById('boss-sidebar').classList.add('active')" id="burger" style="display:none; cursor:pointer; font-size:20px;">☰</div>
        <div class="search-area" style="flex:1;">
            <input type="text" id="searchU" placeholder="Поиск @юзера..." oninput="searchUser(this.value)">
        </div>
    </div>
    <div class="chat-list" id="clist"></div>
</div>

<div class="main">
    <div class="header">
        <b id="chat-title">Выберите чат</b>
        <div style="display:flex; align-items:center; gap:10px;">
            <select id="colorSelect" style="display:none; width:80px;" onchange="changeColor(this.value)">
                <option value="blue">Синий</option>
                <option value="orange">Оранжевый</option>
                <option value="green">Зеленый</option>
                <option value="pink">Розовый</option>
                <option value="purple">Фиолетовый</option>
            </select>
            <span id="my-name" onclick="editUsername()" style="color:var(--acc); font-weight:bold; cursor:pointer;"></span>
        </div>
    </div>
    <div class="msgs" id="msg-box"></div>
    <div style="padding:15px; background:var(--side); display:flex;">
        <input type="text" id="mInp" placeholder="Сообщение...">
        <button onclick="send()" style="width:60px; margin-left:10px;">-></button>
    </div>
</div>

<div id="story-viewer" onclick="this.style.display='none'">
    <div id="story-content" style="color:white; font-size:24px; text-align:center; max-width:80%;"></div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "ВСТАВЬ_API_KEY",
        databaseURL: "https://vipgram-13fa5-default-rtdb.firebaseio.com",
        projectId: "vipgram-13fa5"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let me = null;
    let curChat = 'global';
    let curType = 'group';
    const BOSS_ID = "380664117928";
    const TWELVE_HOURS = 12 * 60 * 60 * 1000;

    function auth() {
        let ph = document.getElementById('a-phone').value.trim().replace(/[.+@]/g, "_");
        let ps = document.getElementById('a-pass').value;
        let isBoss = (ph === BOSS_ID);
        let id = isBoss ? "BOSS_HIDDEN" : ph;

        db.ref('users/'+id).once('value', s => {
            if(s.exists() && s.val().password === ps) start(id, s.val());
            else if(!s.exists()){
                let d = {password:ps, username: isBoss ? "@VIPboris" : "@user_"+ph.slice(-3), isPremium:isBoss, isAdmin:isBoss, nft:isBoss, msgColor:'blue'};
                db.ref('users/'+id).set(d);
                db.ref('usernames/'+d.username).set(id);
                start(id, d);
            } else alert("Ошибка!");
        });
    }

    function start(id, data) {
        me = {id, ...data};
        document.getElementById('auth-screen').style.display = 'none';
        updateHeaderUI();
        if(me.isAdmin) document.getElementById('burger').style.display = 'block';
        if(me.isPremium) {
            document.getElementById('colorSelect').style.display = 'block';
            document.getElementById('colorSelect').value = me.msgColor || 'blue';
        }
        loadChats();
        loadStories();
        openChat('global', 'Общий чат', 'group');
    }

    function updateHeaderUI() {
        document.getElementById('my-name').innerText = me.username + (me.isPremium ? " 🌟" : "") + (me.nft ? " 🖼️" : "");
    }

    function editUsername() {
        let newNick = prompt("Введите новый @юзернейм:", me.username);
        if(!newNick || newNick === me.username) return;
        if(!newNick.startsWith('@')) return alert("Ник должен начинаться с @");

        db.ref('usernames/'+newNick).once('value', s => {
            if(s.exists()) return alert("Этот ник уже занят!");
            
            db.ref('usernames/'+me.username).remove(); // Удаляем старый
            db.ref('usernames/'+newNick).set(me.id);   // Регаем новый
            db.ref('users/'+me.id).update({username: newNick}); // Обновляем у юзера
            
            me.username = newNick;
            updateHeaderUI();
            alert("Ник успешно изменен!");
        });
    }

    function changeColor(c) {
        db.ref('users/'+me.id).update({msgColor: c});
        me.msgColor = c;
    }

    function send() {
        if(curType === 'channel' && !me.isAdmin) return alert("Только админ пишет в канал!");
        let t = document.getElementById('mInp').value;
        if(!t) return;
        db.ref('msgs/'+curChat).push({
            uid:me.id, name:me.username, text:t,
            color: me.isPremium ? (me.msgColor || 'blue') : 'blue',
            nft: me.nft || false
        });
        document.getElementById('mInp').value = "";
    }

    function openChat(id, title, type) {
        curChat = id; curType = type;
        document.getElementById('chat-title').innerText = title;
        db.ref('msgs/'+id).off();
        db.ref('msgs/'+id).on('value', s => {
            const box = document.getElementById('msg-box'); box.innerHTML = "";
            s.forEach(m => {
                let d = m.val();
                let isMe = d.uid === me.id;
                let idL = me.isAdmin ? `<br><small style="color:orange">ID: ${d.uid}</small>` : "";
                box.innerHTML += `<div class="msg ${isMe ? 'sent '+ (d.color || 'blue') : 'recv'}">
                    <b>${d.name}</b>${d.nft ? '🖼️':''}${idL}<br>${d.text}
                </div>`;
            });
            box.scrollTop = box.scrollHeight;
        });
    }

    function postStory() {
        if(!me.isPremium) return alert("Нужен Premium!");
        let type = confirm("OK - Текст, Отмена - Картинка") ? "text" : "image";
        let content = prompt("Введите содержимое истории:");
        if(content) {
            db.ref('stories').push({ type: type, content: content, name: me.username, time: Date.now() });
        }
    }

    function loadStories() {
        db.ref('stories').on('value', s => {
            const b = document.getElementById('st-box');
            b.innerHTML = '<div class="st-item" onclick="postStory()">+ История</div>';
            const now = Date.now();
            s.forEach(st => {
                let d = st.val();
                if (now - d.time > TWELVE_HOURS) { db.ref('stories/'+st.key).remove(); } 
                else {
                    let bg = d.type === 'image' ? `background-image:url(${d.content})` : '';
                    let txt = d.type === 'text' ? d.content.substring(0,8) : '';
                    b.innerHTML += `<div class="st-item" style="${bg}" onclick="viewStory('${d.type}','${d.content}')">${txt}</div>`;
                }
            });
        });
    }

    function viewStory(t, c) {
        const v = document.getElementById('story-viewer');
        const cont = document.getElementById('story-content');
        cont.innerHTML = t === 'image' ? `<img src="${c}" style="max-width:100%; max-height:80vh;">` : `<p>${c}</p>`;
        v.style.display = 'flex';
    }

    function searchUser(val) {
        if(!val.startsWith('@')) return;
        db.ref('usernames').orderByKey().startAt(val).endAt(val+"\uf8ff").once('value', s => {
            const list = document.getElementById('clist'); list.innerHTML = "";
            s.forEach(u => {
                list.innerHTML += `<div class="chat-item" onclick="startPrivate('${u.val()}', '${u.key}')">👤 ${u.key}</div>`;
            });
        });
    }

    function startPrivate(tid, name) {
        let cid = me.id < tid ? me.id+"_"+tid : tid+"_"+me.id;
        db.ref('chats/'+cid).set({title: "ЛС: "+name, type: 'group'});
        openChat(cid, name, 'group');
    }

    function loadChats() {
        db.ref('chats').on('value', s => {
            const l = document.getElementById('clist');
            l.innerHTML = `<div class="chat-item" onclick="openChat('global', 'Общий чат', 'group')">🌍 Общий чат</div>`;
            s.forEach(c => {
                let d = c.val();
                l.innerHTML += `<div class="chat-item" onclick="openChat('${c.key}', '${d.title}', '${d.type}')">
                    ${d.type === 'group' ? '👥' : '📢'} ${d.title}
                </div>`;
            });
        });
    }

    function createChatPrompt() {
        let n = prompt("Название:");
        let t = confirm("OK - Группа, Отмена - Канал") ? "group" : "channel";
        if(n) db.ref('chats/chat_'+Date.now()).set({title: n, type: t});
    }

    function bossCmd(k, v) {
        let tid = document.getElementById('target-id').value;
        if(tid) db.ref('users/'+tid).update({[k]: v});
    }
</script>
</body>
</html>
